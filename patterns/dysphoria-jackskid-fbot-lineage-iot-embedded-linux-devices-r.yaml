description: >-
  Dysphoria is a rapidly evolving IoT botnet derived from the jackskid and fbot
  codebases that has added blockchain-based (ENS/SNS) C2 resolution and a relay/proxy
  transformation capability. DDoS-capable bots resolve C2 relay node lists via Ethereum/Solana
  name service TXT records, decode obfuscated IPv4 addresses, and then query a distribution
  endpoint over HTTP to obtain live relay/C2 IPs. Newer 'relay' variants strip out
  DDoS functionality entirely and instead use UPnP to open large numbers of forwarded
  ports on victim NAT gateways, relaying traffic bidirectionally between attackers
  and downstream C2 infrastructure. Relay nodes periodically report health/status
  information back to a hardcoded collection domain, and both DDoS and relay samples
  disguise their running process name to blend in with legitimate Android system
  processes.</br>
