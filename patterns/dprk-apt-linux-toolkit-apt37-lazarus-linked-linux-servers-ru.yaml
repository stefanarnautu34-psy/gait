id: dprk-apt-linux-toolkit-apt37-lazarus-linked-linux-servers-ru
name: Ted backdoor / curlRAT toolkit
family: DPRK APT Linux toolkit (APT37/Lazarus-linked)
version: 1
created: '2026-09-14'
updated: '2026-09-14'
author: Stefan Arnautu / DataAudit.net
source:
  name: Rapid7
  url: https://www.rapid7.com/blog/post/tr-dprk-apts-ted-backdoor-curlrat-target-south-korean-media-automotive-sectors
  published: '2026-09-04'
description: >-
  A Linux-based implant set that trojanizes system daemons (crond, agetty, atd,
  polkitd, sshd) and a recompiled HAProxy binary to give an attacker persistent,
  low-visibility control over compromised edge and internal servers. The curlRAT
  component periodically polls an external C2 server over HTTPS/HTTP using libcurl,
  authenticating requests with a hardcoded API token and a per-victim ID embedded
  in a custom header, then executes commands, drops payloads, or opens reverse/PTY
  shells based on decoded instructions. The Ted backdoor is compiled directly into
  HAProxy and only activates its C2 channel when it observes a specially crafted
  incoming HTTP request to a hidden endpoint, after which it tunnels commands and
  responses through HAProxy's own connection pipeline while scrubbing internal counters
  to hide the activity. Both components layer custom XOR and substitution ciphers
  plus Base64 encoding around their C2 traffic and configuration files to avoid
  signature detection.
severity: high
